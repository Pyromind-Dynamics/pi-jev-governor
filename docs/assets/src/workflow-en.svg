<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="880" viewBox="0 0 1920 880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#F8F7FD"/>
      <stop offset="1" stop-color="#F2EFFA"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="880" fill="url(#bg)"/>

  <text x="80" y="104" font-size="54" font-weight="700" fill="#171A2E">Pi Jev Governor: four decision points in one task flow</text>

  <!-- row 1 arrow shafts -->
  <line x1="514" y1="249" x2="559" y2="249" stroke="#7C5CFF" stroke-width="8"/>
  <polygon points="557,233 583,249 557,265" fill="#7C5CFF"/>
  <line x1="917" y1="249" x2="962" y2="249" stroke="#7C5CFF" stroke-width="8"/>
  <polygon points="960,233 986,249 960,265" fill="#7C5CFF"/>
  <line x1="1410" y1="249" x2="1455" y2="249" stroke="#7C5CFF" stroke-width="8"/>
  <polygon points="1453,233 1479,249 1453,265" fill="#7C5CFF"/>

  <!-- row 1 boxes -->
  <rect x="80" y="176" width="430" height="146" rx="20" fill="#F1EDFC" stroke="#C9BCF6" stroke-width="2"/>
  <text x="112" y="240" font-size="33" font-weight="700" fill="#221C4A">Planning strategy</text>
  <text x="112" y="280" font-size="24" fill="#5A5F73">direct / plan_only</text>
  <text x="112" y="310" font-size="24" fill="#5A5F73">plan_then_execute</text>

  <rect x="583" y="176" width="330" height="146" rx="20" fill="#F1EDFC" stroke="#C9BCF6" stroke-width="2"/>
  <text x="615" y="240" font-size="33" font-weight="700" fill="#221C4A">Model tier</text>
  <text x="615" y="280" font-size="23" fill="#5A5F73">small / normal / strong</text>

  <rect x="986" y="176" width="420" height="146" rx="20" fill="#F4F4F7" stroke="#DFE0E8" stroke-width="2"/>
  <text x="1018" y="240" font-size="33" font-weight="700" fill="#4A4F63">Coding agent</text>
  <text x="1018" y="280" font-size="24" fill="#5A5F73">plans · codes · uses tools</text>

  <rect x="1479" y="176" width="360" height="146" rx="20" fill="#F1EDFC" stroke="#C9BCF6" stroke-width="2"/>
  <text x="1511" y="240" font-size="33" font-weight="700" fill="#221C4A">Permission</text>
  <text x="1511" y="280" font-size="24" fill="#5A5F73">rules → Jev → human</text>

  <!-- down connector from Permission into row 2 -->
  <line x1="1659" y1="322" x2="1659" y2="603" stroke="#7C5CFF" stroke-width="8"/>
  <line x1="1659" y1="603" x2="1434" y2="603" stroke="#7C5CFF" stroke-width="8"/>
  <polygon points="1432,587 1406,603 1432,619" fill="#7C5CFF"/>

  <!-- row 2 arrow shafts (leftwards) -->
  <line x1="984" y1="603" x2="941" y2="603" stroke="#7C5CFF" stroke-width="8"/>
  <polygon points="939,587 913,603 939,619" fill="#7C5CFF"/>
  <line x1="581" y1="603" x2="538" y2="603" stroke="#7C5CFF" stroke-width="8"/>
  <polygon points="536,587 510,603 536,619" fill="#7C5CFF"/>

  <!-- row 2 boxes -->
  <rect x="986" y="530" width="420" height="146" rx="20" fill="#F4F4F7" stroke="#DFE0E8" stroke-width="2"/>
  <text x="1018" y="594" font-size="33" font-weight="700" fill="#4A4F63">Execute &amp; verify</text>
  <text x="1018" y="634" font-size="22" fill="#5A5F73">tests · tool output · diff stat</text>

  <rect x="583" y="530" width="330" height="146" rx="20" fill="#F1EDFC" stroke="#C9BCF6" stroke-width="2"/>
  <text x="615" y="594" font-size="33" font-weight="700" fill="#221C4A">Outcome judge</text>
  <text x="615" y="634" font-size="24" fill="#5A5F73">finish / retry / replan</text>

  <rect x="80" y="530" width="430" height="146" rx="20" fill="#F4F4F7" stroke="#DFE0E8" stroke-width="2"/>
  <text x="112" y="594" font-size="33" font-weight="700" fill="#4A4F63">Deliver or correct</text>
  <text x="112" y="634" font-size="24" fill="#5A5F73">shared correction budget ≤ 2</text>

  <!-- footer -->
  <rect x="80" y="740" width="1759" height="88" rx="18" fill="#F4F2FA"/>
  <text x="128" y="793" font-size="24" fill="#4A4F66">Deterministic rules define boundaries · low-confidence and sensitive operations go to humans · logs record actions, usage, and outcomes</text>
</svg>
