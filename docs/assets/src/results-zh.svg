  <rect x="72" y="764" width="1396" height="92" rx="16" fill="#FBF1E6"/>
  <rect x="72" y="866" width="1396" height="92" rx="16" fill="#FFFFFF"/>

  <text x="104" y="618" font-size="30" font-weight="600" fill="#1E2233">qwen3.8-27b</text>
